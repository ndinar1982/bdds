<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f87d0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Семейный бюджет">
<title>Семейный бюджет</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=853">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=853">
<style>
:root{--bg:#e9f0f7;--fg:#1d2a39;--muted:#5b6c80;--card:#fff;--line:#d3dde8;--accent:#2b8ae0}
@media (prefers-color-scheme:dark){:root{--bg:#0f151d;--fg:#e5ecf4;--muted:#9eb0c4;--card:#161f2a;--line:#2a3848;--accent:#5aa8f0}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.shell{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;box-shadow:0 18px 50px rgba(20,40,70,.12);text-align:center}
.logo{width:84px;height:84px;border-radius:19px;display:block;margin:0 auto 14px}
h1{margin:0 0 6px;font-size:24px}
p{margin:8px 0;color:var(--muted)}
.note{font-size:13px;line-height:1.5}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
button{font:inherit;font-weight:700;border-radius:11px;padding:11px 16px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);margin-top:12px}
.err{color:#c43a3a;font-weight:600;min-height:1.3em;margin-top:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<section class="shell">
  <img class="logo" src="apple-touch-icon.png?v=853" alt="">
  <h1>Семейный бюджет</h1>

  <div id="ready" hidden>
    <p>GitHub-страница готова к запуску приложения.</p>
    <p class="note" id="installHint">На iPhone сначала выберите <b>Поделиться → На экран «Домой»</b>. Значок будет наш. После этого запускайте приложение с этого значка.</p>
    <div class="btns"><button class="primary" id="open">Открыть приложение</button><button id="change">Изменить ссылку</button></div>
  </div>

  <div id="setup" hidden>
    <p>Укажите прямую ссылку Google Apps Script, которая заканчивается на <b>/exec</b>.</p>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="err" id="err"></div>
    <div class="btns"><button class="primary" id="save">Сохранить</button></div>
  </div>
</section>

<script>
(function(){
  var KEY='bdds-app-url';
  var $=function(id){return document.getElementById(id)};
  var valid=function(u){return /^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(u)};
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;

  function get(){try{return localStorage.getItem(KEY)||''}catch(e){return ''}}
  function set(v){try{localStorage.setItem(KEY,v)}catch(e){}}
  function fromHash(){
    var m=/^#u=(.+)$/.exec(location.hash),u='';
    if(!m)return '';
    try{u=decodeURIComponent(m[1])}catch(e){u=m[1]}
    return valid(u)?u:'';
  }
  function show(id){$('ready').hidden=id!=='ready';$('setup').hidden=id!=='setup'}
  function launch(){
    var u=get()||fromHash();
    if(!valid(u)){show('setup');return}
    set(u);
    location.replace(u);
  }

  var hu=fromHash();if(hu)set(hu);
  if(standalone&&valid(get())){launch();return}
  if(valid(get()))show('ready');else show('setup');

  $('open').addEventListener('click',launch);
  $('change').addEventListener('click',function(){$('url').value=get();$('err').textContent='';show('setup');setTimeout(function(){$('url').focus()},50)});
  $('save').addEventListener('click',function(){
    var u=$('url').value.trim();
    if(!valid(u)){$('err').textContent='Нужна ссылка вида https://script.google.com/…/exec';return}
    set(u);show('ready')
  });
  $('url').addEventListener('keydown',function(e){if(e.key==='Enter')$('save').click()});

  if(/iPhone|iPad|iPod/.test(navigator.userAgent))$('installHint').innerHTML='На iPhone сначала выберите <b>Поделиться → На экран «Домой»</b>. Значок будет наш. После этого запускайте приложение с этого значка — GitHub откроет Google Apps Script напрямую, без iframe.';
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
