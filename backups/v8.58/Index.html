  --strip:#d7e2ee; --seg:#f7fafd; --seg-fg:#3f5068; --seg-past:#8c9bb0; --seg-on:#2b8ae0; --seg-on-fg:#ffffff; --now:#f3c33b;

}

  --side-a:#173d66; --side-b:#10294a; --side-fg:#eaf2fb; --side-muted:#9fbbd8; --side-hover:rgba(255,255,255,.08); --side-sel:rgba(0,0,0,.3);

  --accent:#5aa8f0; --accent-soft:#1b3957;
  --good:#5fd395; --good-bg:#173f2b; --bad:#ff8a8a; --bad-bg:#4a2027; --warn-bg:#4a3a10; --warn:#ffd36b;
  --plan:#8fb5ff; --dep:#7fb0ff; --c-sav:#b99cff; --c-debt:#f0b45a; --sel:#5aa8f0; --sel-bg:rgba(90,168,240,.18); color-scheme:dark}}
:root[data-theme="dark"]{

  --card:#222b37; --card-fg:#e8edf3; --card-muted:#98a5b5; --card-good:#9ad45b; --card-bad:#ff8e8e; --card-line:#323d4b;
  --strip:#18222e; --seg:#202c3a; --seg-fg:#c1cfdf; --seg-past:#6e8096; --seg-on:#2b7fd0; --seg-on-fg:#ffffff; --now:#f3c33b;

  --plan:#8fb5ff; --dep:#7fb0ff; --c-sav:#b99cff; --c-debt:#f0b45a; --sel:#5aa8f0; --sel-bg:rgba(90,168,240,.18); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:linear-gradient(180deg,var(--side-a),var(--side-b));color:var(--side-fg);padding:14px 10px 20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand-mark{width:30px;height:30px;flex:none;display:grid;place-items:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
.brand b{display:block;font-size:15px}
.brand small{color:var(--side-muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;background:var(--side-sel);border-radius:10px;padding:4px}
.nav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:7px;color:var(--side-fg);font-weight:700;display:flex;align-items:center;gap:10px}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.2)}
.nav svg{width:17px;height:17px;flex:none}
/* вкладки можно переставлять: перетащить мышью, на телефоне — нажать и подержать */
.nav{touch-action:none}.nav button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nav button.nav-drag{opacity:.5}.nav.nav-dragging,.nav.nav-dragging button{cursor:grabbing}
.nav button.drop-before{box-shadow:inset 0 3px 0 rgba(255,255,255,.95)}.nav button.drop-after{box-shadow:inset 0 -3px 0 rgba(255,255,255,.95)}
.total-box{padding:0 10px}
.total-box small{display:block;font-weight:500;color:var(--side-muted);font-size:11.5px;margin-top:1px}
.accts{display:flex;flex-direction:column;gap:10px}
.acct-group{background:var(--side-sel);border-radius:10px;padding:6px 4px}
.fact-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.side-sync{border:0;background:var(--side-sel);color:var(--side-fg);width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1;cursor:pointer;flex:none}.side-sync:hover{background:var(--side-hover)}.side-sync.spinning{animation:spin 1s linear infinite;cursor:default}
.nav-dot{width:16px;height:16px;border-radius:50%;background:#ff5a6c;margin-left:auto;flex:none;display:inline-flex;align-items:center;justify-content:center}.nav-dot::after{content:'!';color:#fff;font-size:11px;font-weight:900;line-height:1}.nav-dot[hidden]{display:none}
.acct.warn{background:rgba(255,77,94,.22);box-shadow:inset 3px 0 0 #ff5a6c}
.warn-ico{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#ff5a6c;color:#fff;font-style:normal;font-size:10.5px;font-weight:900;margin-right:6px;vertical-align:1px;line-height:1}
.acct-sep .warn-ico,.acct-group h4 .warn-ico{margin:0 0 0 7px}
.acct-group h4[data-col],.acct-sep[data-col]{cursor:pointer;user-select:none}
.acct-group h4[data-col]>span:first-child::before,.acct-sep[data-col]>span:first-child::before{content:'▾';display:inline-block;width:12px;font-style:normal;opacity:.75;transition:transform .15s}
.acct-group.col h4>span:first-child::before,.acct-sec.col .acct-sep>span:first-child::before{transform:rotate(-90deg)}
.acct-group.col .acct{display:none}.acct-group.col h4{margin:0}.acct-sec.col>.acct-body{display:none}
#accts.dragmode .acct-sec.col>.acct-body{display:block}
.alert-box{position:fixed;bottom:24px;left:calc(50% + 140px);transform:translateX(-50%);z-index:45;width:min(560px,calc(100vw - 320px));background:#ffe3e7;color:#b3132b;border:1px solid #f6aab6;border-radius:14px;padding:12px 40px 10px 16px;box-shadow:0 12px 30px rgba(120,20,40,.22);font-size:13.5px;line-height:1.45}
.alert-box[hidden]{display:none}
body:has(.savebar.dirty) .alert-box{display:none} /* окно проблем не должно закрывать кнопку «Сохранить изменения» */
.alert-box b{display:block;font-size:14px;margin-bottom:4px}.alert-box ul{margin:0;padding:0;list-style:none}.alert-box li{margin:3px 0;padding-left:14px;position:relative}.alert-box li::before{content:'•';position:absolute;left:2px;top:0}
.alert-box .ab-go{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}.alert-box .ab-go:hover{text-decoration:underline}
.alert-box small{display:block;margin-top:6px;opacity:.75;font-size:11.5px}.alert-box .ab-x{position:absolute;top:6px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#b3132b;font-size:20px;line-height:1;cursor:pointer}.alert-box .ab-x:hover{background:rgba(179,19,43,.1)}
.acct[draggable]{cursor:grab}.acct.dragging{opacity:.45}.acct.drop-before{box-shadow:inset 0 2px 0 #fff}.acct.drop-after{box-shadow:inset 0 -2px 0 #fff}
.acct-sec{border-radius:10px;transition:background .12s}.acct-sec.drop-in{background:rgba(255,255,255,.14);outline:2px dashed rgba(255,255,255,.55);outline-offset:2px}
.acct-empty{margin:2px 8px 6px;padding:8px;border:1px dashed rgba(255,255,255,.35);border-radius:8px;font-size:11.5px;color:var(--side-muted);text-align:center;display:none}#accts.dragmode .acct-empty{display:block}.acct-sec.empty{display:none}#accts.dragmode .acct-sec.empty{display:block}
.dh{display:inline-block;width:12px;margin:0 0 0 -12px;cursor:grab;color:var(--faint);opacity:0;font-size:12px;line-height:1;vertical-align:middle;user-select:none}
tr.g .dh{margin-left:-2px;margin-right:2px}tr:hover>td.sc .dh{opacity:1}.dh:active{cursor:grabbing}
table.bg tbody tr.drop-before>td{box-shadow:inset 0 2px 0 var(--accent)}table.bg tbody tr.drop-after>td{box-shadow:inset 0 -2px 0 var(--accent)}table.bg tbody tr.dragging>td{opacity:.5}
.acct-sep{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:10px 8px 4px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted)}.accts>.acct-sep:first-child{margin-top:2px}.acct-sep span:last-child{font-size:13px;letter-spacing:0;color:var(--side-fg)}.acct-sep span.neg{color:#ffd0d0}
.acct-group h4{margin:0 0 2px;padding:3px 8px;font-size:12.5px;font-style:italic;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.acct{display:flex;justify-content:space-between;gap:8px;padding:4px 8px 4px 18px;border-radius:6px;font-size:13px}
.acct span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .v{font-weight:600}
.acct .acct-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acct.credit-line{align-items:flex-start}.credit-v{border:0;background:none;color:inherit;padding:0;text-align:right;font:inherit;line-height:1.1;cursor:pointer;min-width:82px}.credit-v b{display:block;font-weight:700;white-space:nowrap}.credit-v small{display:block;color:var(--side-muted);font-size:10.5px;font-weight:500;line-height:1.2;margin-top:2px;white-space:nowrap}.credit-v.neg b{color:#ffd0d0}
.v.neg{color:#ffd0d0}
.side-foot{margin-top:auto;padding:0 10px;color:var(--side-muted);font-size:12px;line-height:1.45}
@media (min-width:761px) and (min-height:501px){
  .side{padding:10px 8px 12px;gap:8px}
  .brand{padding:2px 6px}
  .nav{padding:3px;gap:1px}
  .nav button{padding:7px 9px}
  .accts{gap:6px}
  .acct-group{padding:4px 3px}
  .acct-group h4{padding:2px 7px}
  .acct{padding:3px 7px 3px 17px}
  .acct-sep{margin:6px 7px 3px}
  .side-foot{padding:0 8px}
}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#f0b429}
.dot.on{background:#4cd98a}
/* main */
.main{min-width:0;padding-block:14px 32px;padding-inline:18px}
/* decade strip */
.strip{display:flex;gap:4px;background:var(--strip);border-radius:10px;padding:4px;margin-bottom:10px;overflow:hidden}
.sarrow{flex:none;width:32px;border:0;background:var(--seg);border-radius:7px;display:grid;place-items:center;color:var(--seg-fg)}
.sarrow:disabled{opacity:.4;cursor:default}
.months{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;cursor:grab;touch-action:pan-x}.months::-webkit-scrollbar{display:none}.months.dragging{cursor:grabbing}.months.dragging .seg{cursor:grabbing}.seg.vis{cursor:grab}
.stoday{width:auto!important;padding:0 10px!important;font-size:12px;font-weight:800;white-space:nowrap}
.mo{display:flex;flex-direction:column;gap:2px;flex:1 0 auto}
.mo-l{font-size:11px;font-weight:800;text-align:center;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.segs{display:flex;gap:2px}
.seg.wide{flex:1 0 40px}
.seg{flex:1 0 22px;height:24px;border:0;background:var(--seg);color:var(--seg-fg);font-weight:700;font-size:11.5px;border-radius:5px;position:relative;padding:0 4px}
.seg.past{color:var(--seg-past)}
.seg.vis{background:var(--seg-on);color:var(--seg-on-fg)}
.seg.now::before{content:"";position:absolute;left:0;top:0;border-style:solid;border-width:9px 9px 0 0;border-color:var(--now) transparent transparent transparent;border-top-left-radius:4px}
.seg:hover:not(.vis){background:var(--accent-soft)}
/* grid */
.tw{overflow:auto;max-height:calc(100vh - 104px);padding-bottom:var(--alerth,0px);border-radius:var(--r);background:var(--bg);outline:none;overscroll-behavior:contain}
.tw:focus-visible{box-shadow:0 0 0 2px var(--accent)}
table.bg{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content}
table.bg th,table.bg td{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.bg thead th{position:sticky;background:var(--bg);z-index:2;font-weight:600}
table.bg thead tr.cards th{top:0;height:166px;padding:0 0 6px;vertical-align:bottom}
table.bg thead tr.colh th{top:166px;height:40px;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);text-align:right;line-height:1.2;text-transform:uppercase;letter-spacing:.05em}
table.bg thead tr.colh th.on{color:var(--fg)}
table.bg thead tr.colh th small{display:block;overflow:hidden;text-overflow:clip;text-transform:none;letter-spacing:0;font-size:10.5px;font-weight:700;color:var(--good)}
table.bg thead tr.colh th.on.mp small{color:var(--plan)}
table.bg .sc{position:sticky;left:0;z-index:1}
table.bg thead th.sc{z-index:3;text-align:left}
table.bg tr.colh th.sc{border-left:1px solid var(--line);border-top-left-radius:var(--r)}
table.bg tr.colh th.last{border-right:1px solid var(--line);border-top-right-radius:var(--r)}
.blk{border-left:8px solid var(--bg)}
table.bg tbody td{height:26px;background:var(--surface);border-bottom:1px dotted var(--dot);text-align:right}
table.bg tbody td.sc{text-align:left;border-left:1px solid var(--line);border-right:1px solid var(--line)}
table.bg tbody td.last{border-right:1px solid var(--line)}
table.bg tbody tr.g td{background:var(--group);font-weight:700;border-bottom:1px solid var(--line)}
table.bg tbody tr.i td.sc{padding-left:26px;font-weight:500}
table.bg tbody tr.i td.sc small{color:var(--faint);font-size:11px;margin-left:6px}
table.bg tbody tr.b td{background:var(--surface-2);font-size:12.5px;border-bottom:1px solid var(--line)}
table.bg tbody tr.b td.sc{padding-left:26px;color:var(--muted);font-style:italic}
table.bg tbody tr:last-child td{border-bottom:1px solid var(--line)}
table.bg.monthly thead tr.cards th{height:166px}table.bg.monthly thead tr.colh th{top:166px}
.gbtn{border:0;background:none;padding:0;font-weight:700;display:inline-flex;align-items:center;gap:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gbtn svg{width:10px;height:10px;flex:none;transition:transform .15s}
.gbtn svg.ticon,.gbtn[aria-expanded="false"] svg.ticon{width:16px;height:16px;transform:none;color:var(--accent);margin-right:-1px}
.ticon{width:15px;height:15px;flex:none;vertical-align:-3px;margin-right:6px}
.acct-group h4 .ticon{opacity:.9;font-style:normal}
h3 .ticon.ti-set{width:17px;height:17px;vertical-align:-3px;margin-right:7px;color:var(--accent)}
.gbtn[aria-expanded="false"] svg{transform:rotate(-90deg)}
td.cell{cursor:cell;user-select:none}
td.cell.fact-ro,td.cell.dev-ro{cursor:pointer}
td.cell.k-inc,td.k-inc{color:var(--good)}
td.cell.k-exp,td.cell.k-wd,td.k-exp{color:var(--bad)}
td.cell.k-dep,td.k-dep{color:var(--dep)}
td.cell.off{opacity:.5}
.gtag{font-weight:600;font-size:11px;color:var(--muted);margin-left:2px}
.legend-k{display:inline-flex;gap:12px;flex-wrap:wrap}
.legend-k b.i{color:var(--good)} .legend-k b.d{color:var(--dep)} .legend-k b.e{color:var(--bad)}
/* settings: items */
.it-sec{margin-top:14px}
.it-sec h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
details.it-sec>summary{margin-bottom:0}details.it-sec[open]>summary{margin-bottom:8px}details.it-sec>summary .ticon{width:17px;height:17px;color:var(--accent)}.it-sub{margin:0 0 8px}
.it-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--dot)}
.it-row input[type=text],.it-row input:not([type]){border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:7px;padding:7px 9px;font:inherit;min-width:0;width:100%}

.it-row input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.it-row label.chk{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.it-row .it-del{border:0;background:none;color:var(--bad);font-weight:600;font-size:12.5px;padding:4px 6px}
.it-row .it-del:disabled{visibility:hidden}
.it-row .ph{font-size:11px;color:var(--faint)}

const factDate=()=>state.settings?.factDate||todayIso;
const modeOf=p=>p.end<factDate()?'f':'p';
const num=x=>typeof x==='number'?Math.abs(x):null;
const val=(dc,rid,k)=>num(state.decades[dc.key]?.v?.[rid]?.[k]);
const mval=(m,rid,k)=>num(state.months[m.key]?.v?.[rid]?.[k]);
// Закрытая декада — факт. В открытой декаде расходы и переводы считаются как max(план, факт).
// Для доходов безопасный режим консервативнее: как только появился факт, считаем его окончательной суммой,
// а не автоматически ожидаем недостающую часть плана. Старое правило можно вернуть в Настройках.
const used=(dc,rid)=>{const f=val(dc,rid,'f')||0;if(modeOf(dc)==='f')return f;return Math.max(val(dc,rid,'p')||0,f)};

function compute(){
  const accts=M.items.filter(x=>['cash','credit','savings','debt'].includes(x.type));
  const bal=Object.fromEntries(accts.map(a=>[a.id,Number(a.opening)||0]));
  if(!('cash' in bal))bal.cash=0;
  const all=Object.values(M.rows);
  const typeOf=Object.fromEntries(accts.map(a=>[a.id,a.type]));
  const res=[];const appliedAdj=Object.fromEntries(accts.map(a=>[a.id,0]));
  for(const dc of DECADES){
    const cashStart=bal.cash;let inc=0,cashExp=0,trans=0,transCC=0,transSD=0,cardPurch=0,debtOut=0;
    for(const r of all){
      const v=used(dc,r.id);if(!v)continue;
      bal.cash+=r.cash*v;
      if(r.acct)bal[r.acct]=(bal[r.acct]||0)+r.bal*v;
      if(r.kind==='inc'&&!r.acct)inc+=v;
      else if(r.kind==='exp'&&!r.acct)cashExp+=v;
      else if(r.acct){trans+=r.cash*v;if(r.item.type==='credit')transCC+=r.cash*v;else transSD+=r.cash*v;if(r.s==='_exp')cardPurch+=v;if(r.item.type==='debt'&&r.s==='_out')debtOut+=v}
    }
    accts.forEach(a=>{const z=balanceAdjAt(a,dc.end),d=z-appliedAdj[a.id];if(d)bal[a.id]=(bal[a.id]||0)+d;appliedAdj[a.id]=z});
    const total=Object.values(bal).reduce((a,b)=>a+b,0); // все счета, включая наличку
    const cardsSav=Object.entries(bal).reduce((a,[k,b])=>typeOf[k]==='credit'||typeOf[k]==='savings'||typeOf[k]==='debt'?a+b:a,0);
    const byType={credit:0,savings:0,debt:0};Object.entries(bal).forEach(([k,b])=>{if(byType[typeOf[k]]!==undefined)byType[typeOf[k]]+=b});
    res.push({dc,bal:{...bal},total,cardsSav,byType,inc,cashStart,cashExp,trans,transCC,transSD,cardPurch,debtOut});
  }
  return res;
}
function computeBdr(res){
  // Закрытые декады (конец раньше даты факта) — по факту; текущая и будущие — по плану,
  // но если факт уже больше плана — берём факт.
  const ids=t=>M.items.filter(x=>x.type===t).map(x=>x.id);
  const L={inc:ids('income'),exp:ids('expense').concat(ids('credit').map(i=>i+'_exp')),
    savIn:ids('savings').map(i=>i+'_in'),savOut:ids('savings').map(i=>i+'_out'),
    ccIn:ids('credit').map(i=>i+'_in'),ccOut:ids('credit').map(i=>i+'_out'),ccExp:ids('credit').map(i=>i+'_exp'),
    dIn:ids('debt').map(i=>i+'_in'),dOut:ids('debt').map(i=>i+'_out')};
  const cashItem=M.items.find(x=>x.type==='cash');let cash=Number(cashItem&&cashItem.opening)||0,cashAdj=0;
  const out=[];
  for(const m of MONTHS_P){
    const E={},P={},F={};Object.keys(L).forEach(k=>{E[k]=0;P[k]=0;F[k]=0});let nClosed=0;
    m.dec.forEach(di=>{const dc=DECADES[di];const closed=modeOf(dc)==='f';if(closed)nClosed++;
      for(const k in L)L[k].forEach(id=>{const p=val(dc,id,'p')||0,f=val(dc,id,'f')||0;P[k]+=p;F[k]+=f;E[k]+=closed?f:used(dc,id)})});
    const fd=factDate();
    const st=nClosed===m.dec.length?'f':(nClosed>0||(m.start<=fd&&fd<=m.end))?'c':'p';
    const income=E.inc,expense=E.exp,sav=E.savIn-E.savOut,cc=E.ccIn-E.ccOut,debt=E.dIn-E.dOut;
    // наличка и дебет: покупки по кредиткам оплачены картой, а не деньгами — их не вычитаем
    const cashStart=cash;cash+=income-(expense-E.ccExp)-sav-cc+debt;
    const z=balanceAdjAt(cashItem,m.end);cash+=z-cashAdj;cashAdj=z;
    out.push({m,st,income,expense,net:income-expense,sav,cc,debt,cardPurch:E.ccExp,cashStart,cashEnd:cash,incP:P.inc,incF:F.inc,expP:P.exp,expF:F.exp});
  }
  return out;
}

// safe arithmetic: 12000, 8000+150+500, =2*(1500+300), 1 234,56
function evalExpr(src){
  let s=String(src).replace(/[\s  ₽]/g,'').replace(/[−–]/g,'-').replace(/^=/,'').replace(/,/g,'.');
  if(s==='')return null;
  let i=0;const pk=()=>s[i];
  const nm=()=>{const mt=/^(\d+(\.\d*)?|\.\d+)/.exec(s.slice(i));if(!mt)throw 0;i+=mt[0].length;return parseFloat(mt[0])};
  const factor=()=>{if(pk()==='-'){i++;return -factor()}if(pk()==='+'){i++;return factor()}if(pk()==='('){i++;const v=expr();if(pk()!==')')throw 0;i++;return v}return nm()};
  const term=()=>{let v=factor();while(pk()==='*'||pk()==='/'){const o=s[i++];const w=factor();v=o==='*'?v*w:v/w}return v};
  const expr=()=>{let v=term();while(pk()==='+'||pk()==='-'){const o=s[i++];const w=term();v=o==='+'?v+w:v-w}return v};
  try{const v=expr();if(i!==s.length||!Number.isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}
}

function useGas(){

    if(pendingWrites||editing||(ui.draft&&!state.stale))return;

  // Пока свежие данные не пришли, правка заблокирована, а кнопка ⟳ крутится.
  try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');

function useClaude(db){
  store.kind='claude';document.getElementById('storeText').textContent='Изменения видны всей семье сразу.';
  const remote={decades:new Set(),months:new Set()};const chains={};
  store.write=ch=>{
    const by={};ch.forEach(c=>{const k=c.sheet+'/'+c.key;(by[k]=by[k]||[]).push(c)});
    const jobs=Object.entries(by).map(([path,list])=>{
      const [coll,key]=path.split('/');const ref=db.doc(path);
      const full=()=>{const d=state[coll][key];return ref.set({start:d.start,end:d.end,v:d.v})};
      const job=()=>{
        if(!remote[coll].has(key))return full().then(()=>remote[coll].add(key));
        const patch={};list.forEach(c=>{(patch[c.rid]=patch[c.rid]||{})[c.k]=c.value});
        return ref.update({v:patch}).catch(e=>{if(e&&e.code==='invalid_argument')return full();throw e});
      };
      return chains[path]=(chains[path]||Promise.resolve()).catch(()=>{}).then(job);
    });
    return track(Promise.all(jobs));
  };
  const saveSettingsDoc=()=>db.doc('settings/main').set({factDate:state.settings.factDate||null,order:state.settings.order||null,nav:state.settings.nav||null,launch:state.settings.launch||null,config:state.config||getItems()});
  store.writeSettings=()=>track(saveSettingsDoc());
  store.saveConfig=()=>track(saveSettingsDoc());
  let got={s:false,decades:false,months:false};
  const done=()=>{if(got.s&&got.decades&&got.months&&!state.ready){state.ready=true;setSync(true,'Синхронизировано');render()}};
  db.doc('settings/main').onSnapshot(s=>{const d=s.exists?s.data():{};state.settings={factDate:d.factDate||null,order:d.order||null,nav:d.nav||null,launch:d.launch||null,opening:d.opening};state.config=d.config||null;got.s=true;if(state.ready)safeRender();done()},()=>setSync(false,'Нет связи'));
  for(const coll of ['decades','months'])db.collection(coll).onSnapshot(q=>{const m={};remote[coll].clear();q.docs.forEach(d=>{m[d.id]=d.data();remote[coll].add(d.id)});
    if(!pendingWrites)state[coll]=m;got[coll]=true;if(state.ready)safeRender();done()},()=>setSync(false,'Нет связи'));
}

function computeAlerts(res){

  const neg=[];for(let i=from;i<res.length;i++)if(Math.round(res[i].bal.cash)<0)neg.push(i);

  M.items.filter(a=>a.type==='credit'&&!a.hidden&&(Number(a.limit)>0||limitHist(a).length)).forEach(a=>{
    for(let i=from;i<res.length;i++){const b=res[i].bal[a.id]||0,lim=limitAt(a,DECADES[i].end);if(lim+b<-0.5){
      out.push({key:'cc_'+a.id,kind:'card',id:a.id,dec:i,text:`${a.name}: долг ${moneyShort(-b)} ₽ превысит лимит ${moneyShort(lim)} ₽ в декаде ${label(DECADES[i])} (сверх лимита ${moneyShort(-b-lim)} ₽).`});break}}
  });
  // накопления не могут быть меньше нуля: это реальные деньги на счёте
  M.items.filter(a=>a.type==='savings'&&!a.hidden).forEach(a=>{
    for(let i=from;i<res.length;i++){const b=res[i].bal[a.id]||0;if(b<-0.5){
      out.push({key:'sv_'+a.id,kind:'sav',id:a.id,dec:i,text:`${a.name}: остаток уйдёт в минус — ${money(b)} в декаде ${label(DECADES[i])}. По плану из накоплений берётся больше, чем на них лежит.`});break}}
  });
  return out;
}
